config:
  title: "&8Configuração do Everest"
  rows: 4

home:
  title: "&8Configuração do Everest"
  items:
    spawns:
      material: BLAZE_ROD
      name: "&6Spawns"
      lore:
        - "&7Gerencie os pontos de spawn"
        - "&7deste servidor."
        - ""
        - "&eClique para abrir."

spawns:
  title: "&8Spawns"
  empty:
    name: "&cNenhum spawn"
    lore:
      - "&7Crie um com o esmeralda abaixo"
      - "&7ou use &f/setspawn <nome>&7."
  create:
    name: "&aNovo spawn"
    lore:
      - "&7Cria um spawn na sua posição."
      - ""
      - "&eClique e digite o nome no chat."

edit:
  title: "&8Spawn: {name}"
  rename:
    name: "&eRenomear"
    lore:
      - "&7Troca o nome deste spawn."
      - ""
      - "&eClique e digite no chat."
  icon:
    name: "&bÍcone"
    lore:
      - "&7O item que aparece na lista."
      - ""
      - "&ePegue um bloco no criativo"
      - "&ee clique aqui para trocar."
  position:
    name: "&bAtualizar posição"
    lore:
      - "&7Salva este spawn onde você está."
      - ""
      - "&eClique para atualizar."
  default:
    name: "&6Spawn padrão"
    lore-on:
      - "&7Join spawn global: quem entra no"
      - "&7servidor vem para cá, em qualquer"
      - "&7mundo, se não houver retorno no login."
      - ""
      - "&aEste é o spawn padrão"
      - "&eClique para manter."
    lore-off:
      - "&7Join spawn global: quem entra no"
      - "&7servidor vem para cá, em qualquer"
      - "&7mundo, se não houver retorno no login."
      - ""
      - "&7Não é o spawn padrão"
      - "&eClique para definir."
  logout:
    name: "&dRetorno no login"
    lore-on:
      - "&7Se o jogador sair neste mundo,"
      - "&7volta para este spawn na próxima"
      - "&7entrada em vez do spawn padrão."
      - "&7Ex.: lobby do Bedwars."
      - ""
      - "&aAtivado"
      - "&eClique para desligar."
    lore-off:
      - "&7Se o jogador sair neste mundo,"
      - "&7volta para este spawn na próxima"
      - "&7entrada em vez do spawn padrão."
      - "&7Ex.: lobby do Bedwars."
      - ""
      - "&cDesativado"
      - "&eClique para ligar."
  world-respawn:
    name: "&cRespawn do mundo"
    lore-on:
      - "&7Quem morrer neste mundo respawna"
      - "&7aqui, não no spawn padrão."
