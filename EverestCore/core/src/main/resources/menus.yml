      - "&aAtivado"
      - "&eClique para desligar."
    lore-off:
      - "&7Quem morrer neste mundo respawna"
      - "&7aqui, não no spawn padrão."
      - ""
      - "&cDesativado"
      - "&eClique para ligar."
  delete:
    name: "&cRemover spawn"
    lore:
      - "&7Apaga este spawn para sempre."
      - ""
      - "&cClique para confirmar."

delete:
  title: "&8Remover?"
  confirm:
    name: "&aConfirmar"
    lore:
      - "&7Remove o spawn de vez."
      - ""
      - "&cIsso não tem volta."
  cancel:
    name: "&cCancelar"
    lore:
      - "&7Volta sem apagar nada."

